<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="light dark">
<title>Sharing Debugger: preview links on Facebook, X and Google</title>
<meta name="description" content="Paste a URL to see how it will look when shared on Facebook, X and in Google search, and check its Open Graph, Twitter Card and SEO tags.">
<meta name="application-name" content="Sharing Debugger">
<meta name="apple-mobile-web-app-title" content="Sharing Debugger">
<meta name="theme-color" content="#5546f0">
<link rel="canonical" href="/">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest" crossorigin="use-credentials">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Sharing Debugger">
<meta property="og:title" content="Sharing Debugger">
<meta property="og:description" content="See how your link looks on Facebook, X and Google search before you share it.">
<meta property="og:url" content="/">
<meta property="og:image" content="/og-image.png">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Sharing Debugger: see how your link looks before you share it.">
<meta property="og:locale" content="en_US">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Sharing Debugger">
<meta name="twitter:description" content="See how your link looks on Facebook, X and Google search before you share it.">
<meta name="twitter:image" content="/og-image.png">
<meta name="twitter:image:alt" content="Sharing Debugger: see how your link looks before you share it.">
<script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Sharing Debugger","description":"Preview how a link looks when shared on Facebook, X and in Google search, and check its Open Graph, Twitter Card and SEO tags.","applicationCategory":"DeveloperApplication","operatingSystem":"Any","browserRequirements":"Requires JavaScript","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"}}</script>
<link rel="stylesheet" href="/style.css">
<script src="/theme.js"></script>
<script src="/app.js" defer></script>
</head>
<body>
<div class="band">
  <div class="shell">
    <h1 class="visually-hidden">Preview how a link looks when shared</h1>
    <header>
      <a class="brand" href="/"><span class="logo"><svg class="icon" aria-hidden="true"><use href="/icons.svg#arrow-up-right"/></svg></span>Sharing Debugger</a>
      <div class="theme" role="radiogroup" aria-label="Theme">
        <button type="button" role="radio" data-theme-option="auto" aria-label="Auto theme" title="Auto"><svg class="icon" aria-hidden="true"><use href="/icons.svg#monitor"/></svg></button>
        <button type="button" role="radio" data-theme-option="light" aria-label="Light theme" title="Light"><svg class="icon" aria-hidden="true"><use href="/icons.svg#sun"/></svg></button>
        <button type="button" role="radio" data-theme-option="dark" aria-label="Dark theme" title="Dark"><svg class="icon" aria-hidden="true"><use href="/icons.svg#moon"/></svg></button>
      </div>
    </header>

    <form id="inspect-form" class="composer">
      <label for="url" class="visually-hidden">Page URL</label>
      <div class="field">
        <svg class="icon field-icon" aria-hidden="true"><use href="/icons.svg#link"/></svg>
        <input id="url" name="url" type="url" placeholder="Enter a URL to inspect" required autocomplete="off" spellcheck="false">
        <button id="submit" type="submit"><span class="spinner" aria-hidden="true"></span>Inspect<svg class="icon" aria-hidden="true"><use href="/icons.svg#arrow-up-right"/></svg></button>
      </div>
    </form>
  </div>
</div>

<main class="shell">
  <p id="error" role="alert" hidden></p>
  <p id="loading" class="visually-hidden" role="status" hidden>Fetching page…</p>

  <section id="results" hidden>
    <div class="result-top">
      <div class="result-meta">
        <h2 id="result-title"></h2>
        <p id="result-url"></p>
      </div>
      <button id="download" class="ghost" type="button"><svg class="icon" aria-hidden="true"><use href="/icons.svg#download"/></svg>JSON</button>
    </div>
    <div id="summary" class="summary"></div>

    <div class="tabs" role="tablist" aria-label="Preview">
      <button type="button" role="tab" id="tab-facebook" aria-controls="panel-facebook" aria-selected="true"><svg class="icon" aria-hidden="true"><use href="/icons.svg#facebook"/></svg>Facebook</button>
      <button type="button" role="tab" id="tab-x" aria-controls="panel-x" aria-selected="false" tabindex="-1"><svg class="icon" aria-hidden="true"><use href="/icons.svg#twitter"/></svg>X</button>
      <button type="button" role="tab" id="tab-search" aria-controls="panel-search" aria-selected="false" tabindex="-1"><svg class="icon" aria-hidden="true"><use href="/icons.svg#search"/></svg>Search</button>
    </div>
    <div id="panel-facebook" role="tabpanel" aria-labelledby="tab-facebook" class="panel"></div>
    <div id="panel-x" role="tabpanel" aria-labelledby="tab-x" class="panel" hidden></div>
    <div id="panel-search" role="tabpanel" aria-labelledby="tab-search" class="panel" hidden></div>

    <div id="checks" class="checks"></div>

    <details class="hood">
      <summary>Under the hood<svg class="icon" aria-hidden="true"><use href="/icons.svg#chevron-down"/></svg></summary>
      <div id="details"></div>
    </details>
  </section>
</main>
</body>
</html>
