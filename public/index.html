<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="light dark">
<title>Sharing Debugger</title>
<link rel="stylesheet" href="/style.css">
<script src="/app.js" defer></script>
</head>
<body>
<div class="shell">
  <header>
    <a class="brand" href="/"><span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M9 7h8v8"/></svg></span>Sharing Debugger</a>
    <span class="tag">Private</span>
  </header>

  <main>
    <section class="hero">
      <h1>Preview any link</h1>
      <p class="intro">See how a page looks when it’s shared.</p>
    </section>

    <form id="inspect-form" class="composer">
      <label for="url" class="visually-hidden">Page URL</label>
      <div class="field">
        <svg class="field-icon" aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>
        <input id="url" name="url" type="url" placeholder="https://example.com/page" required autocomplete="off" spellcheck="false">
        <button id="submit" type="submit"><span class="spinner" aria-hidden="true"></span><span class="label">Inspect</span></button>
      </div>
    </form>

    <p id="error" role="alert" hidden></p>
    <p id="loading" role="status" hidden>Fetching page…</p>

    <section id="results" hidden>
      <div class="result-top">
        <div class="result-meta">
          <h2 id="result-title"></h2>
          <p id="result-url"></p>
        </div>
        <button id="download" class="ghost" type="button">Export JSON</button>
      </div>
      <div id="summary" class="summary"></div>

      <h3 class="section-label">Previews</h3>
      <div id="previews" class="previews"></div>

      <h3 class="section-label">Checks <span id="warning-count" class="count"></span></h3>
      <ul id="warnings" class="checks"></ul>

      <h3 class="section-label">Metadata</h3>
      <div id="details" class="details"></div>
    </section>
  </main>

  <footer>Server-side fetch · No JavaScript execution · Nothing saved</footer>
</div>
</body>
</html>
